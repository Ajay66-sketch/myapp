# docker-compose.dev.yml
# High-speed local development orchestrator with bind-mounts and hot-reloading

version: '3.8'

services:
  # Database Layer (MongoDB)
  db:
    image: mongo:7.0-jammy
    container_name: dev_mongodb
    ports:
      - "27017:27017"
    volumes:
      - dev_mongo_data:/data/db

  # In-Memory Cache and Pub/Sub (Redis)
  redis:
    image: redis:7.2-alpine
    container_name: dev_redis
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data

  # Node Backend (Hot Reloading via Local Directory Bind-Mounts)
  backend:
    image: node:20-alpine
    container_name: dev_backend
    working_dir: /usr/src/app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - API_PORT=5000
      - MONGODB_URI=mongodb://db:27017/messaging-app
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev_super_secret_key_antigravity_12345
      - CLIENT_URL=http://localhost:3000
      - SOCKET_CLIENT_URL=http://localhost:3000
      - TRUST_PROXIES=loopback
      - DISABLE_CSRF=true
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: ["sh", "-c", "npm install && node --watch src/server.js"]
    depends_on:
      - db
      - redis

  # React Client Dev Server (Vite Dev Server exposed directly)
  frontend:
    image: node:20-alpine
    container_name: dev_frontend
    working_dir: /usr/src/app/client
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
      - VITE_SOCKET_URL=http://localhost:5000
    volumes:
      - ./client:/usr/src/app/client
      - /usr/src/app/client/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 3000"]
    depends_on:
      - backend

volumes:
  dev_mongo_data:
    driver: local
  dev_redis_data:
    driver: local
