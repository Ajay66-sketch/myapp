apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-replicaset
  namespace: scholar-prod
spec:
  serviceName: "mongodb-replicaset-svc"
  replicas: 3
  selector:
    matchLabels:
      app: mongodb-replicaset
  template:
    metadata:
      labels:
        app: mongodb-replicaset
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - mongodb-replicaset
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: mongodb
          image: mongo:6.0
          command:
            - "mongod"
            - "--replSet"
            - "rs0"
            - "--bind_ip_all"
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
        - name: bootstrap
          image: mongo:6.0
          command:
            - "bash"
            - "-c"
            - |
              echo "Waiting for replica set nodes to start..."
              sleep 15
              mongosh --host mongodb-replicaset-0.mongodb-replicaset-svc:27017 --eval "
                try {
                  rs.status();
                  print('Replica set rs0 already initialized.');
                } catch(e) {
                  print('Initializing replica set rs0...');
                  rs.initiate({
                    _id: 'rs0',
                    members: [
                      { _id: 0, host: 'mongodb-replicaset-0.mongodb-replicaset-svc:27017' },
                      { _id: 1, host: 'mongodb-replicaset-1.mongodb-replicaset-svc:27017' },
                      { _id: 2, host: 'mongodb-replicaset-2.mongodb-replicaset-svc:27017' }
                    ]
                  });
                }
              "
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-replicaset-svc
  namespace: scholar-prod
spec:
  clusterIP: None
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongodb-replicaset
