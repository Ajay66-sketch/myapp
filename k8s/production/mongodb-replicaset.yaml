apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-replicaset
  namespace: scholar-prod
spec:
  serviceName: "mongodb-replicaset-svc"
  replicas: 3
  selector:
    matchLabels:
      app: mongodb-replicaset
  template:
    metadata:
      labels:
        app: mongodb-replicaset
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - mongodb-replicaset
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: mongodb
          image: mongo:6.0
          command:
            - "mongod"
            - "--replSet"
            - "rs0"
            - "--bind_ip_all"
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-replicaset-svc
  namespace: scholar-prod
spec:
  clusterIP: None
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongodb-replicaset
---
# SRE-grade One-Time Job to initialize MongoDB replica set safely
# Eliminates CrashLoopBackOff that occurred with a standard sidecar!
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-replicaset-bootstrap
  namespace: scholar-prod
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: mongo:6.0
          command:
            - "bash"
            - "-c"
            - |
              echo "Waiting for replica set nodes to start..."
              until mongosh --host mongodb-replicaset-0.mongodb-replicaset-svc.scholar-prod.svc.cluster.local:27017 --eval "db.runCommand({ping: 1})" &>/dev/null; do
                echo "Waiting for mongodb-replicaset-0..."
                sleep 2
              done
              
              mongosh --host mongodb-replicaset-0.mongodb-replicaset-svc.scholar-prod.svc.cluster.local:27017 --eval "
                try {
                  const status = rs.status();
                  print('Replica set rs0 already initialized: ' + status.set);
                } catch(e) {
                  print('Initializing replica set rs0...');
                  const res = rs.initiate({
                    _id: 'rs0',
                    members: [
                      { _id: 0, host: 'mongodb-replicaset-0.mongodb-replicaset-svc.scholar-prod.svc.cluster.local:27017' },
                      { _id: 1, host: 'mongodb-replicaset-1.mongodb-replicaset-svc.scholar-prod.svc.cluster.local:27017' },
                      { _id: 2, host: 'mongodb-replicaset-2.mongodb-replicaset-svc.scholar-prod.svc.cluster.local:27017' }
                    ]
                  });
                  print(JSON.stringify(res));
                }
              "
