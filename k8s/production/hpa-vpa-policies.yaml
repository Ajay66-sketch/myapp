apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scholar-backend-hpa
  namespace: scholar-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scholar-backend
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: scholar-backend-vpa
  namespace: scholar-prod
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scholar-backend
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: app
        minAllowed:
          cpu: "100m"
          memory: "256Mi"
        maxAllowed:
          cpu: "2000m"
          memory: "2048Mi"
        controlledResources: ["cpu", "memory"]
