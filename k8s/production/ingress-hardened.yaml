# k8s/production/ingress-hardened.yaml
# High-performance enterprise-grade split routing for production ingress
# Completely separates WebSockets (sticky affinity) from stateless REST APIs (round-robin) to optimize balance and speed!

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scholar-api-ingress
  namespace: scholar-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/secure-backends: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRequestBodyAccess On
      SecRule REQUEST_HEADERS:User-Agent "Slowloris" "id:1000001,phase:1,deny,status:403,log,msg:'Slowloris attack blocked'"
spec:
  rules:
    - host: api.scholarplatform.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scholar-api-svc
                port:
                  number: 80
  tls:
    - hosts:
        - api.scholarplatform.com
      secretName: scholar-tls-cert
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scholar-websocket-ingress
  namespace: scholar-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/secure-backends: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    # SRE WebSocket Sticky Session Affinity Annotations (Strict Socket.IO compliance!)
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "scholar-websocket-svc"
spec:
  rules:
    - host: api.scholarplatform.com
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: scholar-websocket-svc
                port:
                  number: 80
  tls:
    - hosts:
        - api.scholarplatform.com
      secretName: scholar-tls-cert
