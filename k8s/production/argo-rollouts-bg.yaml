apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: scholar-backend-bg
  namespace: scholar-prod
spec:
  replicas: 3
  strategy:
    blueGreen:
      activeService: scholar-backend-svc
      previewService: scholar-backend-preview-svc
      autoPromotionEnabled: false
  selector:
    matchLabels:
      app: scholar-backend-bg
  template:
    metadata:
      labels:
        app: scholar-backend-bg
    spec:
      containers:
        - name: app
          image: antigravity/scholar-backend:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
