apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scholar-backend-hpa
  namespace: scholar-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scholar-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
