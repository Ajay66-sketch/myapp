apiVersion: apps/v1
kind: Deployment
metadata:
  name: scholar-backend
  namespace: scholar-prod
  labels:
    app: scholar-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scholar-backend
  template:
    metadata:
      labels:
        app: scholar-backend
    spec:
      containers:
        - name: app
          image: antigravity/scholar-backend:latest
          ports:
            - containerPort: 5000
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
            requests:
              cpu: "250m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: scholar-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: scholar-backend-svc
  namespace: scholar-prod
spec:
  selector:
    app: scholar-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
