# k8s/helm/scholar-platform/values.yaml
# Hardened production-ready parameterizations for the Scholar Platform

replicaCount: 3

image:
  repository: antigravity/scholar-backend
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
  hosts:
    - host: api.scholarplatform.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: scholar-tls-cert
      hosts:
        - api.scholarplatform.com

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1024Mi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true

# ConfigMap & Secrets Environment Bindings
env:
  NODE_ENV: "production"
  PORT: "5000"
  MONGO_URI: "mongodb://mongodb-replicaset-0.mongodb-replicaset-svc:27017,mongodb-replicaset-1.mongodb-replicaset-svc:27017,mongodb-replicaset-2.mongodb-replicaset-svc:27017/scholar-prod?replicaSet=rs0&authSource=admin&readPreference=secondaryPreferred"
  REDIS_MODE: "cluster"
  REDIS_CLUSTER_NODES: "redis-cluster-0.redis-cluster-svc:6379,redis-cluster-1.redis-cluster-svc:6379,redis-cluster-2.redis-cluster-svc:6379"
  VAULT_ADDR: "http://vault.scholar-prod.svc.cluster.local:8200"
  VAULT_SECRET_PATH: "v1/secret/data/scholar-prod"
  OTEL_SERVICE_NAME: "scholar-backend"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector:4318/v1/traces"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - scholar-platform
        topologyKey: "kubernetes.io/hostname"
