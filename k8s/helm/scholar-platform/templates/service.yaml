apiVersion: v1
kind: Service
metadata:
  name: {{ include "scholar-platform.fullname" . }}-svc
  namespace: {{ .Release.Namespace | default "scholar-prod" }}
spec:
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "scholar-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
