# nginx/nginx.conf
# Hardened Enterprise-Grade Reverse Proxy & WAF Configuration

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8096; # Increased for high concurrency (100k+ sockets)
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Production structured log format containing security elements & trace context correlation
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'trace_id="$http_x_correlation_id" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    # Performance optimization buffers
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off; # Security hardening: hide nginx version

    # WAF and Security Hardening Parameters
    client_max_body_size 10M; # Prevent massive payload exhaustion
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # Protection against Slowloris attacks
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Gzip Compression Optimization
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zone - 100 requests per second burst protection
    limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=50r/s;

    upstream backend_cluster {
        ip_hash; # Sticky sessions for Socket.IO clustering
        server backend:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend SPA Static Assets routing with CDN Caching controls
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Static asset caching definition
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
                access_log off;
            }
        }

        # Socket.IO sticky-sessions reverse proxy with timeout protections
        location /socket.io/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            
            # WebSocket timeouts adjusted for keeping 100k sockets alive
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # API backend routes proxy with rate limiting and secure routing
        location /api/ {
            # Apply rate limiting to secure APIs
            limit_req zone=api_limit_zone burst=100 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering adjustments
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }
}
