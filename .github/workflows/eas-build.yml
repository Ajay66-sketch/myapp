# .github/workflows/eas-build.yml
# Automated Expo Application Services (EAS) CI/CD Mobile Build Pipeline
# Builds native iOS IPA and Android AAB binaries dynamically on production pushes

name: Mobile EAS CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build iOS & Android Apps via EAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Expo / EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Run TypeScript Validation
        run: |
          cd mobile
          npm run ts:check --if-present

      - name: Trigger Multi-Platform EAS Build
        run: |
          cd mobile
          eas build --platform all --profile production --non-interactive
